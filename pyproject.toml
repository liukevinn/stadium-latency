[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courtside"
version = "0.1.0"
description = "In-stadium latency trading tool for Kalshi sports win markets"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "websockets>=13.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/courtside"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
