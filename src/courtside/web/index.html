<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Courtside">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <title>Courtside</title>
</head>
<body>
  <!-- iOS has no navigator.vibrate; clicking the label of a switch checkbox gives a haptic tick (iOS 18+). -->
  <input type="checkbox" switch id="haptic" aria-hidden="true" tabindex="-1">
  <label for="haptic" id="haptic-label" aria-hidden="true"></label>

  <section id="auth" hidden>
    <h1>Courtside</h1>
    <p>Paste the server token (COURTSIDE_TOKEN).</p>
    <input id="token-input" type="password" autocomplete="off" spellcheck="false">
    <button id="token-save" class="wide">Save</button>
  </section>

  <section id="main" hidden>
    <header>
      <span id="conn" class="dot down" title="connection"></span>
      <span id="env" class="badge"></span>
      <button id="mode" class="mode paper">PAPER</button>
      <span class="spacer"></span>
      <button id="open-picker" class="icon text" aria-label="choose game">GAME</button>
      <button id="open-settings" class="icon" aria-label="settings">⚙</button>
    </header>

    <div id="alert" class="alert" hidden></div>

    <div id="market" class="market">
      <div id="title" class="title">No game selected</div>
      <div class="quote">
        <div><span class="label">BID</span><span id="bid" class="num">–</span></div>
        <div id="team-a" class="team">–</div>
        <div><span class="label">ASK</span><span id="ask" class="num">–</span></div>
      </div>
    </div>

    <div class="status">
      <div class="row">
        <span id="state" class="state">–</span>
        <span id="countdown" class="countdown"></span>
      </div>
      <div class="bar"><div id="deadline-bar"></div></div>
      <div class="row small">
        <span id="position">flat</span>
        <span id="pnl">P&amp;L –</span>
      </div>
      <div id="latency" class="row small dim">last tap –</div>
    </div>

    <!-- Kalshi's view of the account (not the engine's). Tap for the full portfolio. -->
    <button id="account" class="account">
      <div class="row">
        <span>Cash <b id="cash">–</b></span>
        <span>Open P&amp;L <b id="open-pnl">–</b></span>
      </div>
      <div id="here" class="row here">no position in this game</div>
      <div id="others" class="small dim"></div>
    </button>

    <div class="pads">
      <button id="up" class="pad up"><span class="arrow">▲</span><span id="up-label">TEAM A</span><span class="sub">good</span></button>
      <button id="down" class="pad down"><span class="arrow">▼</span><span id="down-label">TEAM A</span><span class="sub">bad</span></button>
    </div>

    <button id="flatten" class="flatten"><span id="flatten-fill"></span><span class="flatten-text">HOLD TO FLATTEN</span></button>
  </section>

  <section id="picker" class="sheet" hidden>
    <header><button class="icon close" data-close>✕</button><h2>Choose game</h2></header>
    <input id="search" type="search" placeholder="Team or league, e.g. duke" autocomplete="off">
    <div class="chips" id="sport-chips">
      <button data-sport="football">Football</button>
      <button data-sport="basketball">Basketball</button>
      <button data-sport="baseball">Baseball</button>
      <button data-sport="">Other</button>
    </div>
    <p class="dim small">Tap the team that is <b>Team A</b> (▲ = good for them).</p>
    <div id="games"></div>
  </section>

  <section id="portfolio" class="sheet" hidden>
    <header>
      <button class="icon close" data-close>✕</button><h2>Portfolio</h2>
      <span class="spacer"></span>
      <button id="portfolio-refresh" class="icon text">REFRESH</button>
    </header>
    <div id="pf-summary" class="pf-summary"></div>
    <div id="pf-list"></div>
    <p id="pf-updated" class="small dim"></p>
  </section>

  <section id="settings" class="sheet" hidden>
    <header><button class="icon close" data-close>✕</button><h2>Settings</h2></header>
    <form id="settings-form"></form>
    <p id="settings-msg" class="small"></p>
    <button id="settings-save" class="wide">Save</button>
    <button id="forget-token" class="wide ghost">Forget token</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
